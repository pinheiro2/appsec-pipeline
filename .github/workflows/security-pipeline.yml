name: DevSecOps Pipeline

on:
  workflow_dispatch: 

jobs:
  sast-scan:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Run Semgrep Scan
        continue-on-error: true
        run: >
          semgrep scan 
          --config="p/default" 
          --config="p/golang" 
          --config="p/owasp-top-ten"
          --sarif --output=semgrep-results.sarif

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: semgrep-results.sarif

  dast-scan:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    #needs: sast-scan 
    permissions:
      contents: read
      security-events: write
      actions: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'

      - name: Build and Start API
        run: |
          # Build the binary to ensure execution speed
          go build -o vuln-api main.go
          
          # Run the API in the background (&) so the pipeline doesn't block
          ./vuln-api &
          
          # Sleep briefly to ensure the server is fully up before scanning
          sleep 5 
          
          # Quick local curl to verify it's responding
          curl -s http://localhost:8080/health

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8080'
          
          fail_action: false